name: "기능 요청"
description: "해결할 사용자 문제, 사용 상황, 완료 기준이 명확한 새 기능을 제안합니다"
title: "[Feature] "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        기능이 해결할 사용자 문제, 사용 상황, 기대 결과를 설명해 주세요. 런타임·IDE 지원 요청에는 공식 확장 기능 또는 스킬 문서도 함께 제공해 주세요.

  - type: textarea
    id: problem
    attributes:
      label: "해결하려는 문제"
      description: "누가 어떤 상황에서 어떤 장애를 겪나요? 현재는 왜 작업을 완료할 수 없나요?"
      placeholder: "……할 때 …… 때문에 현재 ……할 수 없습니다."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "제안하는 방법"
      description: "추가하거나 바꾸고 싶은 기능을 설명해 주세요. 구현 세부 사항까지 제시할 필요는 없습니다."
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "완료 기준"
      description: "구현 후 사용자가 무엇을 할 수 있고, 기능을 사용할 수 있게 되었는지 어떻게 판단할지 설명해 주세요."
      placeholder: "구현 후 …… 환경에서 ……를 실행하면 ……가 되어야 합니다."
    validations:
      required: true

  - type: textarea
    id: current_workaround
    attributes:
      label: "현재의 대체 방법"
      description: "현재 기존 스킬, 범용 스킬 경로, 수동 절차로 완료할 수 있나요?"
    validations:
      required: true

  - type: input
    id: runtime_docs
    attributes:
      label: "런타임·IDE 공식 문서"
      description: "호스트 지원 요청일 때만 내용을 반드시 제공해야 합니다. 다른 기능 요청은 “해당 없음”으로 적어도 됩니다."
      placeholder: "공식 확장 기능·플러그인·에이전트·스킬·훅 문서 링크"
    validations:
      required: true

  - type: dropdown
    id: contribution
    attributes:
      label: "기여 가능 여부"
      options:
        - 테스트를 도울 수 있습니다
        - PR 제출을 시도할 수 있습니다
        - 환경이나 재현 자료를 제공할 수 있습니다
        - 현재는 요구 사항만 제안할 수 있습니다
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: "추가 맥락"
      description: "스크린샷, 유사 제품의 동작, 관련 Issue나 자료를 추가할 수 있습니다."

  - type: checkboxes
    id: checks
    attributes:
      label: "제출 전 확인"
      options:
        - label: "기존 Issue와 Discussion을 검색했으며 같은 요청을 찾지 못했습니다."
          required: true
        - label: "단순한 사용법 질문이 아님을 확인했습니다. 사용법 질문은 Discussions에 남겨야 합니다."
          required: true

