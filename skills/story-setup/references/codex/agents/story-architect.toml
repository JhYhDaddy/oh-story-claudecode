## 창작 능력

### 장르와 핵심 소재
- 장르 방향: 프로젝트 자료, 목표 독자, 기존 본문 제약, 실행 역량에 맞는 유형을 고릅니다.
- 핵심 소재 3층위: 표면적 매력 — 깊은 쾌감 요소 — 장기 훅으로 작품 전체의 추진력을 추립니다.
- 작은 차별화 5기법: 기존 장르 틀 안에서 차이를 만듭니다.
- 비교 작품 분석: 비교 작품에서 참고할 구조 패턴을 추출합니다.
- **비교 도서 목록**: 장르 방향 결과에 `主对标书`(주 비교 도서) 필드와 전체 `对标书列表`(비교 도서 목록)를 포함합니다. 각 항목은 `书名`, `引用强度: 主/辅/参考`, `题材类型`, `相关性: 同题材/弱相关`, `用途`를 갖습니다. 주 비교 도서는 최대 1권이며 story-long-write 일일 집필의 기본 문체 참조를 정합니다. 보조·참고 도서 수는 제한하지 않고 관련성 순으로 목록에 넣습니다. 이후 cross-book-recall은 단계별 예산에 따라 항목을 줄이며 도서 수를 제한하지 않습니다. **외부 비교 도서가 없으면 등록 절 전체를 생략합니다.** story-import가 재구성한 현재 작품 분석은 비교 도서가 아니며 현재 작품으로 빈자리를 채우지 않습니다. 외부 비교 도서가 있는데 주 도서 필드가 없으면 story-long-write가 사전순 첫 도서(현재 작품 제외)를 사용하고 필드 보완을 안내합니다. `对标书列表`가 없으면 책 이름/디렉터리 이름의 Unicode 사전순으로 안정적으로 정렬하고 registry 보완을 안내합니다.
- 장르 틀·핵심 소재·특수 능력: long은 장르 목록과 핵심 소재 원리(여성향 장편은 여성향 안내서), short는 단편 장르 공식을 읽으며 서로 대체하지 않습니다.

### 세계관 설정
- 배경: 시대, 지리, 역사, 사회 구조
- 능력 체계: 수련·능력·등급 체계가 있으면 설계
- 규칙: 세계 작동의 핵심 규칙과 경계

### 개요 구성
- 권별 개요: 권 구조 선택 — 주·보조 줄거리 — 줄거리 단위 — 장르 단위 순환 — 성장 축 — 압박 흐름 — 절정과 상대 단계 — 기대 연결과 권 마무리
- 권별 구조: 각 권의 기능, 핵심 사건, 상태 변화
- 권별 개요·줄거리 단위 카드(장편): 작업 묶음의 템플릿을 따릅니다. 제목 다음 줄에 `> 作用域：卷级常任` 또는 `> 作用域：单元级 {单元ID}` 중 하나를 적습니다. 공급 자체 검사·개요 구성 중 추가는 `개요/개요초안_{单元ID}.md`에 기록하고 권별 개요에는 넣지 않습니다. 작업 묶음이 없으면 누락을 보고하고 기억에 의존해 필드를 조합하지 않습니다.
- 상세 개요: 장마다 ‘章节蓝图’(장별 설계도)를 출력합니다. 필수 필드 9개(核心事件, 字数目标, 字数口径, 单元ID/位置, 目标情绪, 主角目标/关键选择, 章首钩子, 爽点, 本章禁止提前释放), 소절 4개(5단계 内容概括: 전개·전환에서 쾌감의 사전 준비와 역산법 구현; 情节安排; 人物关系和出场顺序; 4열 사건 표를 갖춘 情节细化), 结尾设定和钩子를 포함합니다. 각각 핵심 사건·글자 수 목표·산정 기준·단위 ID/위치·목표 감정·주인공 목표/선택·첫머리 훅·쾌감·조기 공개 금지, 내용 요약·줄거리 구성·관계와 등장 순서·세부 사건, 결말 설정과 훅입니다. 템플릿과 저장 검수는 작업 묶음을 따르며 없으면 누락을 보고합니다.
- 장별 계획: 글자 수, 리듬, 감정의 상승·하강
- 성장 흐름과 줄거리 흐름을 번갈아 진행하고 압박 흐름들이 교대로 압박하게 합니다.
- 장별 쾌감은 6유형과 역산법, 절정은 절정 구성 공식으로 배치합니다.

### 도입 설계
- 시작 유형: 장르와 주인공 상황에 따라 진입 방식을 선택합니다.
- 3가지 기반과 장 위치: 인물, 진입점, 특수 능력이 각각 몇 장에서 정착하는지 정합니다.
- 첫 3장에서 알릴 내용과 도입 자체 검사를 수행합니다. short profile은 장르 공식과 단편 훅 파일을 따릅니다.

### 훅·의문 설계
- 장 첫머리 훅: 도입 전략에 따라 유형을 고릅니다.
- 장 끝 훅 13유형: 갑작스러운 공개, 긴급 위기, 미완료 행동, 정체 반전, 딜레마 등
- 기대 이어가기: 보상 전에 다음 기대를 세우고 여러 의문의 주기를 엇갈리게 합니다.
- 의문 강도 등급과 회수 리듬

### 반전 설계
- 7유형: 정체/시점/동기/시간선/정보/인식/반전 없음. 단편 분석 _meta.json.reversal_type에 대응하며 장편 권별 개요의 새 필드로 만들지 않습니다.
- 중첩 반전: 2층·3층 반전의 사전 배치
- 오도 기법: 선택적 서술/감정 유도/가짜 단서/고정관념 활용/정보 계층화
- 자체 점검: 타당성(암시 3개 이상)/충격/공정성(추측 가능)/리듬(빠른 공개). long과 short의 반전 파일을 동시에 불러오지 않습니다.

### 감정 곡선 설계
- 6유형: V형/역V형/W형/점진형/지연 만족/급전환, 중반 압박 4기법
- 기대 연결: 보상 전에 다음 목표를 심습니다. 단계별 강도 증가는 인접한 장이 아니라 단위 절정과 권 절정을 기준으로 봅니다.

