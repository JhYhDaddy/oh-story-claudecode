## 参考文件路径规则


**确定项目根目录：** 直接使用宿主交给你的当前工作区/项目根；不要执行 shell。以下所有路径均从该根目录解析。

读取参考文件时，直接 Read 当前 Codex 部署的 canonical 路径，禁止先用 Glob/Grep 搜索：
1. `{项目根}/.codex/skills/story-setup/references/agent-references/{文件名}`

文件不存在时返回缺失事实，由主会话提示重新运行 `$story-setup`；不要探测其他 CLI 的目录。

禁止只读裸文件名、禁止跳级、禁止跨 skill 读其他 skill 的 references。

> **한국어 안내 — 참조 파일 경로 규칙:** 위 원문은 호스트별 어댑터 생성기가 변환하는 계약입니다. 호스트가 준 현재 작업 공간/프로젝트 루트를 그대로 쓰며 셸을 실행하지 않습니다. 모든 경로는 그 루트 기준입니다. 위 Claude canonical 경로를 Read로 바로 읽고 Glob/Grep으로 먼저 탐색하지 않습니다. 파일이 없으면 누락을 보고해 주 세션이 `$story-setup` 재실행을 안내하게 합니다. 다른 CLI 디렉터리 탐색, 경로 없는 파일명 읽기, 상위 경로 건너뛰기, 다른 스킬의 references 읽기는 금지합니다.

호출자가 작업 묶음(책 안의 `.story/work/개요작성/*.md`)을 주면 먼저 전문을 읽습니다. 이것이 이번 작업의 절차·템플릿·읽기 목록이며 profile 표는 작업 묶음에 없는 문제에만 사용합니다. 작품 설정과 개요는 묶음의 절차에 따라 프로젝트 파일에서 필요한 곳을 읽습니다. 작업 묶음이 없으면 매번 먼저 `story-setup/references/agent-references/agent-reference-profiles.md`를 읽고 호출 인수나 프로젝트 산출물에 따라 `long` / `short`를 고릅니다. `common + 현재 profile`만 불러올 수 있습니다. 판단할 수 없으면 부모 절차에 `Reference Profile: unresolved`를 반환하고 두 기준을 섞어 대체하지 않습니다. 결과물 첫 줄에 실제 사용한 `Reference Profile`을 보고합니다.

## 참조 자료 체계

`story-setup/references/agent-references/agent-reference-profiles.md`가 유일한 자료 목록·읽기 조건의 출처입니다. 작업 묶음이 없으면 이 파일의 `Common + 현재 profile` 표를 한 줄씩 판단해 조건과 이번 작업 유형이 모두 맞는 행만 읽습니다. 절이 지정되면 그 절만 읽고 조건에 맞지 않는 파일은 미리 읽지 않습니다. 아래는 방법 설명이며 자료를 읽을지는 profile 표가 정합니다. 능력 목록을 따라 모든 자료를 추가로 읽지 않습니다.

