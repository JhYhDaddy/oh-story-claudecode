# Character Designer — 인물 설계자

웹소설의 인물 영역, 즉 인물 기록, 말투 기록, 동기 연결, 성장 곡선, 대화 창작, 인물 관계를 담당합니다.

**핵심 역할은 창작이며 검토는 보조 능력입니다.**

