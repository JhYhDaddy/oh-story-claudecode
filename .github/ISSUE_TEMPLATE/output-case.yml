name: "출력 품질 사례"
description: "문체·인물·전개 속도·논리·AI 문체가 기대에 맞지 않는 구체적인 생성 사례를 제출합니다"
title: "[Output Case] "
labels:
  - output-case
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        실제 생성 사례를 수집합니다. 필요한 맥락, 실제 출력, 구체적인 문제를 제공해 주세요.

        Issue는 공개됩니다. 공개할 권한이 있는 내용만 제출하고, 원고 전체·API 키·토큰·개인정보를 붙여 넣지 마세요.

  - type: input
    id: version
    attributes:
      label: "Oh Story 버전"
      description: "`skills/story/VERSION`에서 확인할 수 있습니다. main을 사용한다면 커밋 SHA를 적어 주세요."
      placeholder: "예: 0.7.7 또는 a03f0a8"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Claude Code
        - Codex
        - OpenCode
        - ZCode
        - OpenClaw
        - Reasonix
        - Google Antigravity
        - 범용 에이전트 / 웹 AI
        - 기타
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: "모델"
      placeholder: "실제로 집필을 수행한 모델의 이름과 버전을 적어 주세요"
    validations:
      required: true

  - type: dropdown
    id: skill
    attributes:
      label: "사용한 스킬"
      multiple: true
      options:
        - story-long-write
        - story-short-write
        - story-deslop
        - story-review
        - story-import
        - story-long-analyze
        - story-short-analyze
        - 기타
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: "원래 기대했던 결과"
      description: "“문장이 좋아야 한다”라고만 쓰지 말고, 이 대목이 달성해야 할 줄거리·인물·감정 목표를 구체적으로 적어 주세요."
      placeholder: "예: 여주인공은 남주인공을 의심하지만 아직 폭로하면 안 됩니다. 자연스럽게 행동하면서 세부 사항으로 상대를 떠봐야 합니다."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "최소한의 필요 맥락"
      description: "사례를 판단하는 데 필요한 설정·상세 개요·앞부분·지시만 제공하고 프로젝트 전체를 붙여 넣지 마세요."
      placeholder: "인물의 제약, 관련 사건, 바로 앞부분, 추가 프롬프트 등."
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: "실제 출력 일부"
      description: "앞뒤 맥락을 충분히 포함한 200~1500자를 권장합니다. 너무 길면 문제를 가장 잘 보여주는 연속된 구간을 발췌해 주세요."
      placeholder: "실제로 생성된 연속된 구간을 붙여 주세요."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "기대와 다른 구체적인 부분"
      description: "구체적인 위치를 한 곳 이상 인용하고, 어떤 인물·줄거리·문체·전개 속도 요구를 어겼는지 설명해 주세요."
      placeholder: |
        인용: “처음부터 계속 날 속였던 거구나!” 그녀가 자기도 모르게 소리쳤다.
        문제: 반응이 지나치게 직접적이라 “감정을 숨기는 습관”이라는 설정에 어긋나고, 이번 장의 갈등도 너무 일찍 드러냅니다.
    validations:
      required: true

  - type: textarea
    id: direction
    attributes:
      label: "원하는 수정 방향"
      description: "완전한 수정 원고가 필요하지는 않지만, 어떤 처리가 목표에 더 맞는지 설명해 주세요."
      placeholder: "먼저 믿는 척한 뒤, 시간을 묻거나 옷의 흔적을 관찰하며 떠보면 좋겠습니다."
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: "재시도 결과"
      options:
        - 같은 입력에서 같은 문제가 여러 번 발생함
        - 비슷한 장에서 같은 문제가 반복됨
        - 다시 생성한 뒤 사라짐
        - 아직 재시도하지 않음
    validations:
      required: true

  - type: input
    id: attempts
    attributes:
      label: "시도 횟수"
      placeholder: "예: 생성 3회 중 2회 발생"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: "제출 전 확인"
      options:
        - label: "“AI 느낌이 강하다”, “감정이 없다” 같은 총평만 적지 않고 구체적인 문제를 표시했습니다."
          required: true
        - label: "위 내용을 공개할 권한이 있으며 API 키, 토큰, 개인정보, 공개하고 싶지 않은 원고를 삭제했습니다."
          required: true

